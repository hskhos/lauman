default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>

development:
  <<: *default
  database: lauman_development

test:
  <<: *default
  database: lauman_test

production:
  primary:
    <<: *default
    database: lauman_production

  cache:
    <<: *default
    database: lauman_production_cache
    migrations_paths: db/cache_migrate

  queue:
    <<: *default
    database: lauman_production_queue
    migrations_paths: db/queue_migrate

  cable:
    <<: *default
    database: lauman_production_cable
    migrations_paths: db/cable_migrate